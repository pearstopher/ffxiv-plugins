[project]
name = "ffxiv-plugins"
version = "0.1.0"
description = "Combined Dalamud plugin repository for all of my FFXIV plugins"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
