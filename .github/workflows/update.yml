name: Update plugin list

# Rebuilds pluginmaster.json and the README plugin table, and commits them if they changed. Runs when a plugin repo's
# release workflow sends a "plugin-updated" event (see docs/plugin-setup.md), on pushes to main, or manually.
# The weekly run only commits if something besides download counts changed, or a count moved by 100 or more.
on:
  repository_dispatch:
    types: [plugin-updated]
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# One run at a time; a run triggered while another is going waits for it.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build pluginmaster.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIN_DOWNLOAD_CHANGE: ${{ github.event_name == 'schedule' && '100' || '0' }}
        run: python -m scripts.build_repo --min-download-change "$MIN_DOWNLOAD_CHANGE"

      - name: Update README plugin list
        run: python -m scripts.readme

      - name: Commit if changed
        run: |
          git add pluginmaster.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update plugin list"
          git push
